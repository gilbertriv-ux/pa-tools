[package]
name = "soundcraft-ui-egui"
description = "SoundCraft's egui user interface: Edit and Mix windows, transport, dialogs, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
repository.workspace = true

[features]
default = []
# Local speech-to-text and the verified model downloader, forwarded to the engine; off by default.
whisper = ["soundcraft-engine/whisper"]
# The in-app model downloader: forwards `download` to the engine, and pulls in `soundcraft-pa-speech`
# (its catalogue + verified downloader) so the Transcript window can offer and drive a download.
download = ["soundcraft-engine/download", "soundcraft-pa-speech/download"]

[dependencies]
soundcraft-brand.workspace = true
craft-ui.workspace = true
soundcraft-time.workspace = true
soundcraft-audio-io.workspace = true
soundcraft-midi.workspace = true
soundcraft-dsp.workspace = true
soundcraft-clap-host.workspace = true
soundcraft-vst3-host.workspace = true
soundcraft-au-host.workspace = true
soundcraft-model.workspace = true
soundcraft-mix.workspace = true
soundcraft-engine.workspace = true
soundcraft-playback.workspace = true
soundcraft-video.workspace = true
# Optional: enabled by the `download` feature. The model catalogue and the verified downloader the
# Transcript window drives. Also a dev-dependency below (the fixed recogniser the tests inject).
soundcraft-pa-speech = { workspace = true, optional = true }
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
image.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# The fixed recogniser that tests of the menu, palette and Transcript window inject.
soundcraft-pa-speech.workspace = true

[lints]
workspace = true

[build-dependencies]
serde_json = { workspace = true }
