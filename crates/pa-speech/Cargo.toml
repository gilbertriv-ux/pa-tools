[package]
name = "soundcraft-pa-speech"
description = "Pa Tools speech-to-text: the Transcriber trait, a fixed transcriber, the Whisper model catalogue, and (feature `whisper`) pure-Rust Whisper inference with word timestamps. Standalone, no workspace deps. Ported from filmcraft-speech (MIT OR Apache-2.0)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Pure-Rust Whisper inference on the CPU via candle, with word-level timestamps (DTW over
# cross-attention) and energy-based bound tightening. Off by default (and out of wasm builds).
whisper = ["dep:candle-core", "dep:candle-nn", "dep:rayon"]
# Verified HTTPS model downloader (pure-Rust TLS: rustls + RustCrypto, OS certificate verification).
download = ["dep:ureq", "dep:rustls", "dep:rustls-rustcrypto", "dep:sha2"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
candle-core = { version = "0.9", default-features = false, optional = true }
candle-nn = { version = "0.9", default-features = false, optional = true }
rayon = { workspace = true, optional = true }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"], optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
sha2 = { version = "0.10", optional = true }
