# Pa Tools CI: the quality gate and a three-OS build.
#
#   gate         `cargo xtask ci` on Linux: rustfmt check, clippy -D warnings, tests, assets, layers
#                and the wasm32 check. AGENTS.md makes this command the gate before every commit; this
#                job runs it on every push to the integration branch and on every pull request.
#   build-test   `cargo build --workspace` and `cargo test --workspace` on macOS (Apple silicon) and
#                Windows, the two platforms the Linux gate does not exercise (CoreAudio and
#                AudioToolbox on macOS, WASAPI and the Windows resource compiler on Windows).
#
# Provenance: written for Pa Tools. The `gate` job is adapted from the `ci.yml` of
# storytold/filmcraft (MIT OR Apache-2.0, (c) ArtCraft Team and the FilmCraft contributors) and the
# OS matrix from the `ci.yml` of storytold/photocraft (MIT OR Apache-2.0, (c) ArtCraft Team and
# the PhotoCraft contributors); see ATTRIBUTION.md. Nothing here is taken from
# storytold/craft-common-actions, which declares no licence (docs/ci-notes-patools.md).
#
# No secrets, no upstream reusable workflows, standard free GitHub-hosted runners only, every
# third-party action pinned to a commit SHA. Dependabot (github-actions) proposes SHA bumps.
name: Pa Tools CI

on:
  push:
    branches: [pa-tools, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch or pull request cancels its older, now superseded run. The integration
# branch is never cancelled: when merges land close together, every state of `pa-tools` that gets a
# run is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/pa-tools' }}

env:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Debug and test builds without debug info: faster compiles and links and a much smaller target
  # directory (a failing test still names its file and line; only backtrace frames lose theirs).
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Release builds in CI skip thin LTO and use parallel codegen units. The release profile is for
  # shipped binaries (release.yml and windows-msi.yml build those); filmcraft measured that LTO makes
  # linking hundreds of test binaries take over an hour on a hosted runner.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  gate:
    name: cargo xtask ci (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unused toolchains in the runner image (Android SDK, .NET, GHC, CodeQL) are deleted in the
      # background: the space is free by the time the build needs it and nothing waits for it.
      - name: Free disk space
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &

      # libasound2-dev: cpal (ALSA); libxkbcommon, wayland, x11, fontconfig: winit and egui;
      # mesa-vulkan-drivers: a software Vulkan (lavapipe) so the headless wgpu/egui render tests
      # have an adapter; libudev-dev: cheap insurance (no crate in today's Cargo.lock links
      # libudev, but device-enumeration crates commonly do).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libfontconfig1-dev mesa-vulkan-drivers pkg-config

      - name: Install Rust (stable with clippy, rustfmt and wasm32)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt \
            --target wasm32-unknown-unknown
          rustup default stable
          rustc --version
          cargo --version

      # A failing run still saves the cache: it holds compiled dependencies, not test results.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Quality gate (cargo xtask ci)
        run: |
          set -o pipefail
          cargo xtask ci 2>&1 | tee ci-step.log

      - name: Failure digest
        if: failure()
        run: bash .github/scripts/ci-digest.sh ci-step.log "cargo xtask ci failed"

      # `cargo xtask ci` stops at its first failing step, and `cargo test` at the first failing test
      # binary. When the tests were what failed, list every failing test and run the gates that never
      # got to run, so one red run shows everything that is red. Only runs on failure.
      - name: Everything else that is red
        if: failure()
        run: |
          if ! grep -q '^FAIL  test' ci-step.log; then
            echo "xtask did not fail in its test step: nothing more to list"
            exit 0
          fi
          {
            cargo test --workspace --no-fail-fast 2>&1
            cargo xtask assets 2>&1
            cargo xtask layers 2>&1
            cargo xtask wasm 2>&1
          } | tee ci-all.log || true
          bash .github/scripts/ci-digest.sh ci-all.log "all failing tests and remaining gates"

      # TEMP (to be removed before merge): probe which recovery tests flake on Linux and why.
      - name: TEMP recovery flake probe
        if: failure()
        run: |
          set +e
          sed -i 's|next.recover(&left\[0\]);|next.recover(\&left[0]); eprintln!("PROBE status={}", next.ui.status);|' crates/ui-egui/tests/recovery.rs
          sed -i 's|        assert_eq!(std::fs::read_dir(&root).unwrap().count(), 1, "{end}");|        eprintln!("PROBE dirs {end}: {:?}", std::fs::read_dir(\&root).unwrap().flatten().map(\|d\| d.file_name()).collect::<Vec<_>>()); assert_eq!(std::fs::read_dir(\&root).unwrap().count(), 1, "{end}");|' crates/ui-egui/tests/recovery.rs
          git diff --stat -- crates/ui-egui/tests/recovery.rs | tail -1
          BIN=$(cargo test -p soundcraft-ui-egui --test recovery --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.executable != null and .target.name == "recovery") | .executable' | tail -1)
          echo "binary: $BIN"
          {
            for mode in parallel one-cpu; do
              for i in $(seq 1 12); do
                rm -rf /tmp/soundcraft-recovery-*
                if [ "$mode" = one-cpu ]; then out=$(taskset -c 0 "$BIN" --nocapture 2>&1); else out=$("$BIN" --nocapture 2>&1); fi
                rc=$?
                if [ $rc -eq 0 ]; then echo "$mode $i: ok"; else
                  echo "$mode $i: FAIL"
                  printf '%s\n' "$out" | grep -E 'PROBE|panicked at|^test .* FAILED|left:|right:|assertion' | head -8
                  find /tmp -maxdepth 3 -path '*soundcraft-recovery-*' -printf '   %p %TT %s\n' 2>/dev/null | head -12
                fi
              done
            done
          } > probe.log 2>&1
          msg=$(awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' probe.log | head -c 30000)
          echo "::error title=TEMP recovery probe::${msg}"

  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Standard free runners only (no xlarge). macos-15 is Apple silicon.
        os: [macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: build-test-${{ matrix.os }}
          cache-on-failure: true

      - name: Build (cargo build --workspace)
        run: |
          set -o pipefail
          cargo build --workspace 2>&1 | tee ci-step.log

      # --no-fail-fast: run every test binary even after one fails, so one red run lists every failure.
      - name: Test (cargo test --workspace)
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee ci-step.log

      - name: Failure digest
        if: failure()
        run: bash .github/scripts/ci-digest.sh ci-step.log "build or test failed on ${{ matrix.os }}"
