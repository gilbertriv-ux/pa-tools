# Pa Tools Windows MSI: builds the unsigned x64 and arm64 installers with the repository's own
# packaging/windows/package.ps1 and uploads them as artifacts.
#
# Written for Pa Tools from package.ps1 and patools.wxs. Nothing is copied from
# storytold/craft-common-actions (no licence file; see docs/ci-notes-patools.md). The `wix extension
# add` step and the action SHAs are facts about public tools, not copied code.
#
# * x64 is built and then installed, run and uninstalled on the same runner (a smoke test of the
#   MSI itself).
# * arm64 is cross-compiled on this x64 runner (needs the MSVC ARM64 build tools, which the
#   windows-latest image has). It cannot run here; the existing windows-arm64.yml installs and
#   runs it on a Windows 11 ARM64 runner.
# * Unsigned: no signing secret is passed to this workflow, so sign.ps1 prints a warning and leaves
#   the files alone. Signed installers come from the release workflow, not from this one.
name: Pa Tools Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [pa-tools]
  pull_request:
    paths:
      - .github/workflows/windows-msi.yml
      - packaging/windows/**

permissions:
  contents: read

# A newer push to a branch or pull request cancels its older run. On `pa-tools` the group is the
# commit, so no run is cancelled, and none is replaced: GitHub replaces a *pending* run when another
# arrives in the same group (the same rule as ci.yml).
concurrency:
  group: msi-${{ github.ref == 'refs/heads/pa-tools' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/pa-tools' }}

env:
  CARGO_INCREMENTAL: "0"
  # A missing resource compiler must fail the build, not ship an icon-less exe. (package.ps1 sets it
  # too; stating it here keeps the requirement visible.)
  SOUNDCRAFT_REQUIRE_WINRES: "1"
  WIX_VERSION: "5.0.2"

jobs:
  msi:
    name: MSI (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
      DIST: ${{ github.workspace }}\dist\${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable with the MSVC target)
        shell: pwsh
        run: |
          $target = if ($env:ARCH -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          rustup toolchain install stable --profile minimal --target $target
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-msi-${{ matrix.arch }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/pa-tools' }}

      # WiX v5 is distributed as a .NET tool (https://www.nuget.org/packages/wix/5.0.2). patools.wxs
      # uses core WiX elements only (no UI, Util or other extension namespace), so the tool alone
      # builds it and no extension is installed. The tool goes into a folder of its own under the
      # runner's temp directory; a path written to GITHUB_PATH takes effect from the next step on.
      - name: Install WiX (the tool, no extensions)
        shell: pwsh
        run: |
          $wixDir = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install wix --version $env:WIX_VERSION --tool-path $wixDir
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install exited with $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_PATH -Value $wixDir
          & (Join-Path $wixDir 'wix.exe') --version

      - name: Build and package (unsigned)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch $env:ARCH

      - name: List the packages
        shell: pwsh
        run: Get-ChildItem $env:DIST | Format-Table Name, Length

      - name: Upload the MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patools-windows-${{ matrix.arch }}-msi
          path: dist/${{ matrix.arch }}/*.msi
          if-no-files-found: error
          retention-days: 14
