version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    # Consolidate updates into a single PR rather than one PR per crate
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # craft-ui (storytold/craft-libs, pinned in the root Cargo.toml) is built against egui 0.36, so
      # the whole egui family has to move together, and only after craft-libs does. A bump to egui
      # 0.37 on its own is not expected to build against craft-ui. Only major and minor updates are
      # blocked (egui is 0.x, so a minor bump is the breaking one); 0.36.x patch releases still come
      # through. Lift this block when the craft-libs pin moves to egui 0.37.
      - dependency-name: "egui"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eframe"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "egui_kittest"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "egui_*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "epaint"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "emath"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "ecolor"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # symphonia 0.6 changes the API that crates/audio-io decodes through. Patch releases of 0.5
      # (bug fixes) still come through; a move to 0.6 is a code change, so it is done by hand.
      - dependency-name: "symphonia*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
