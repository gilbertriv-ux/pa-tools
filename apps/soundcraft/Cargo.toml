[package]
name = "soundcraft"
description = "Pa Tools desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "pa-tools"

# The shipped executable is `pa-tools`; the package keeps its upstream name so merges stay small.
[[bin]]
name = "pa-tools"
path = "src/main.rs"

[lints]
workspace = true

[features]
# ASIO audio devices on Windows (see soundcraft-playback's `asio` feature).
asio = ["soundcraft-playback/asio"]
# Local speech-to-text (`track.transcribe`) and the verified model downloader; off by default.
whisper = ["soundcraft-ui-egui/whisper"]
download = ["soundcraft-ui-egui/download"]

[dependencies]
soundcraft-brand.workspace = true
soundcraft-engine.workspace = true
soundcraft-ui-egui.workspace = true
soundcraft-playback.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

[build-dependencies]
soundcraft-brand.workspace = true
# Icon + VERSIONINFO for pa-tools.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.2", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
