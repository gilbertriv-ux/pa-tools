[package]
name = "soundcraft-cli"
description = "Pa Tools command line: headless editing, conversion, bounce, MCP server, app control"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The shipped executable is `pa-tools-cli`; the package keeps its upstream name so merges stay small.
[[bin]]
name = "pa-tools-cli"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# Local speech-to-text (`track.transcribe`) and the verified model downloader; off by default.
whisper = ["soundcraft-engine/whisper"]
download = ["soundcraft-engine/download"]

[dependencies]
soundcraft-brand.workspace = true
soundcraft-engine.workspace = true
soundcraft-automation.workspace = true
soundcraft-audio-io.workspace = true
soundcraft-dsp.workspace = true
serde_json.workspace = true
